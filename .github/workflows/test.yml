name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    # The inherited extraction worker uses Windows Job Objects to bound memory.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt jsonschema==4.26.0
      - run: python -m unittest discover -s tests -v
